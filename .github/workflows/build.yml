name: Build

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build
        run: mvn -B package

      - name: Publikuj jarke w Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest target/PudzianMCPL-dedy-1.0.0.jar \
            --title "PudzianMCPL-dedy (najnowsza)" \
            --notes "Gotowa jarka na Purpur 1.21.4" \
            --target "${{ github.sha }}"
